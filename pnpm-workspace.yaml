allowBuilds:
  '@biomejs/biome': true
  '@parcel/watcher': true
  # Never approved, and left unapproved: the postinstall downloads a release
  # binary that only the sourcemap upload needs, and nothing here runs it. It
  # was a literal 'set this to true or false' placeholder, which pnpm now exits
  # 1 on, so `pnpm start` could not even reach the deps check.
  '@sentry/cli': false
  '@swc/core': true
  esbuild: true
  sharp: true

# One sharp for the whole tree.
#
# next declares `sharp: ^0.34.5` and pnpm gave it its own copy, while the app
# resolved the 0.35.3 it asks for directly. The image optimizer runs on next's
# copy, and 0.34.5 (libvips 8.17.3 / libheif 1.20.2) cannot decode this repo's
# AVIF product images: sharp throws `source: bad seek`, next catches it, and
# `optimizeImage` falls back to serving the ORIGINAL bytes. Silently - the
# fallback path does not log. Every AVIF on the site was therefore delivered at
# full source size no matter what `w` the browser asked for.
overrides:
  sharp: ^0.35.3

  # Transitive advisories with no direct dependency to bump, all fixed by a
  # patch release. Pinned here rather than left, because `pnpm audit` reported
  # every one of them as high and an audit nobody can get to zero is an audit
  # nobody reads.
  #
  # postcss   arbitrary file read + path traversal via source-map auto-loading
  # nanoid    non-secure generator loops indefinitely on a negative size
  # brace-expansion  DoS via unbounded expansion
  # fast-uri  host confusion via a backslash authority
  postcss: ^8.5.23
  nanoid: ^3.3.17
  brace-expansion: ^5.0.9
  fast-uri: ^3.1.5

  # ...except for minimatch@9, which the blanket line above was breaking.
  #
  # minimatch@9 declares `brace-expansion: ^2.0.2` and its compiled CJS calls
  # `(0, brace_expansion_1.default)(...)`. brace-expansion 5 is ESM-first: its
  # CommonJS build exports { expand, EXPANSION_MAX, EXPANSION_MAX_LENGTH } and
  # no `default` at all. So the override satisfied a ^2.0.2 range with a 5.x
  # major and every glob that went through minimatch@9 died on
  #
  #     TypeError: (0 , brace_expansion_1.default) is not a function
  #
  # That is not a hypothetical. It is why all 11 CI runs were red while
  # `pnpm test` was green locally: the only caller on that path is
  # test-exclude -> glob -> minimatch@9, reached from
  # V8CoverageProvider.getUntestedFiles, which runs under `pnpm test:coverage`
  # and under nothing else. Every test passed and then the coverage reporter
  # threw, so the failure never named a test.
  #
  # The advisory is still closed. GHSA/CVE-2025-5889 is fixed in 1.1.12, 2.0.2,
  # 3.0.1 and 4.0.1, so ^2.0.2 is a patched line and not a rollback to the
  # vulnerable one. minimatch@10 keeps 5.x: it asks for ^5.0.5 itself.
  'minimatch@9>brace-expansion': ^2.0.2
