version: 2

# These PRs target the DEFAULT branch, which is `main`.
#
# A `target-branch: phase5/homepage` override lived here while that branch was
# the mainline. PR #6 squash-merged it into `main` on 2026-08-31 and CLAUDE.md
# has said "main is the only branch" since. The override was exactly the trap
# its own comment warned about: bot PRs kept opening against a branch nobody
# merges, resolving a lockfile nobody runs. Deleted 2026-09-02; the day the
# override outlives its branch, Dependabot stops silently.
#
# 2026-09-08: the two "DELETE THIS LINE" comments that annotated that override
# were still here, five days after the line itself went. Each had drifted onto
# the `schedule:` key below it, so a reader following the instruction literally
# would have deleted the schedule - and a Dependabot entry with no schedule is
# exactly the silent stop the paragraph above warns about. Removed; the history
# lives here, which is where it belongs. An instruction is not a place to keep
# one.
#
# STILL OPEN AND UNMERGEABLE, measured 2026-09-08: PRs #12, #13 and #14 target
# `phase5/homepage`. That branch was NOT deleted - it is still on the remote at
# 9d92080 - so GitHub never auto-closed them and they read as three live
# dependency updates. Nothing merges that branch. Left open rather than closed:
# closing a Dependabot PR suppresses that version, and which branch is the
# mainline is an open question (docs/MIGRATION-NUMBER-COLLISIONS.md).

updates:
  # ---------------------------------------------------------------------------
  # npm, at the root only.
  #
  # `package-ecosystem: npm` is correct for a pnpm repo - the ecosystem name
  # covers npm/yarn/pnpm, and Dependabot reads `pnpm-lock.yaml` (v9 here).
  # There is no separate "pnpm" value; using one would be silently ignored.
  #
  # apps/mobile is DELIBERATELY NOT LISTED. It has its own package.json
  # (@kenyonexpress/mobile) but no lockfile of its own, and it is not a member
  # of the pnpm workspace either - `pnpm-workspace.yaml` has no `packages:` key
  # at all. Dependabot needs a lockfile to resolve against, so an entry here
  # would open an error on every run rather than a pull request. Making it a
  # real workspace member is the fix, and it is a separate change with its own
  # blast radius.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Jerusalem
    # RAISED FROM 5 TO 10 ON 2026-09-08, BECAUSE THE QUEUE WAS STARVED.
    #
    # The limit counts every open pull request Dependabot holds for this
    # ecosystem and directory, across target branches - including ones opened by
    # a configuration that no longer exists. Measured that day: six open npm
    # PRs against a limit of five. #31, #11 and #7 target `main`; #12, #13 and
    # #14 target `phase5/homepage`, which nothing merges and which the block at
    # the top of this file already records as unmergeable and deliberately left
    # open.
    #
    # So the three stranded ones were holding the cap, and the Monday 2026-09-07
    # run - the scheduled one - opened nothing. The newest PR was #31 from the
    # Saturday. Meanwhile `pnpm outdated` listed patch updates waiting across
    # react, react-dom, @sentry/*, tailwindcss and a dozen more: exactly the
    # `patch` group below, the one the auto-merge workflow lands unattended.
    #
    # Dependabot looked alive - a PR three days old - while the thing it exists
    # to do had stopped.
    #
    # Raising the limit rather than closing the three: closing a Dependabot PR
    # tells it to stop offering that version, and `@radix-ui/react-select
    # 2.2.6 -> 2.3.7` in #12 is wanted on `main` too. Deleting
    # `phase5/homepage` would close them as a side effect, but which branch is
    # the mainline is an open question (docs/MIGRATION-NUMBER-COLLISIONS.md) and
    # a branch deletion is not a maintenance decision. Ten leaves room for the
    # three strays plus a full weekly grouping.
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'

    # Grouping is what decides whether this feature is used or muted. Ungrouped,
    # a weekly run on a tree this size opens a wall of one-line PRs, each
    # costing a full CI matrix, and the habit that forms is closing them
    # unread - which also closes the security ones.
    groups:
      # Everything safe enough to land together. This is also exactly the set
      # the auto-merge workflow will merge unattended, so the two definitions
      # must keep agreeing: see .github/workflows/dependabot-auto-merge.yml.
      patch:
        patterns: ['*']
        update-types: [patch]
      # Minor bumps are grouped but NOT auto-merged. A minor release is allowed
      # to add behaviour, and this repo has caught real breakage inside one:
      # see the `minimatch@9>brace-expansion` note in pnpm-workspace.yaml, where
      # a transitive bump turned every glob into a TypeError and the unit suite
      # still reported all tests passing.
      minor-dev:
        dependency-type: development
        update-types: [minor]

    ignore:
      # Next, React and the Supabase client are upgraded deliberately, read
      # against their own migration notes, never by a bot opening a PR. A major
      # on any of these is a project, and AGENTS.md opens by saying this is not
      # the Next.js anyone's training data describes.
      - dependency-name: next
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: '@supabase/*'
        update-types: [version-update:semver-major]
      # Pinned in pnpm-workspace.yaml `overrides` for measured reasons - sharp
      # 0.34.5 cannot decode this repo's AVIF images and the failure is silent,
      # serving full-size source bytes. A bot bump here would reopen that.
      - dependency-name: sharp
        update-types: [version-update:semver-major]

  # ---------------------------------------------------------------------------
  # The Actions themselves. Unpinned `@v4` tags already float, so this is less
  # about versions than about being told when an action is retired - which
  # otherwise surfaces as a workflow that fails on a day nobody changed it.
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns: ['*']
