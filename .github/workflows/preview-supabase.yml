name: Preview Supabase branch

# Ephemeral database per pull request, paired with the Vercel preview the
# GitHub integration already creates. This workflow does NOT call
# `vercel deploy`. A second deploy would race the integration for the alias
# and would need a VERCEL_TOKEN this public repository must not hold.
#
# Skip loudly when the secrets are unset. The only hosted database this
# repository can currently reach is production; creating a branch on that
# project, or pointing a write job at it, is refused by name.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: preview-supabase-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PRODUCTION_PROJECT_REF: ixvwfbuvfxxsjiywhbbb

jobs:
  branch:
    name: Ephemeral Supabase branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Decide whether this job can run
        id: gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PREVIEW_PROJECT_REF: ${{ secrets.SUPABASE_PREVIEW_PROJECT_REF }}
          PRODUCTION_PROJECT_REF: ${{ env.PRODUCTION_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PREVIEW_PROJECT_REF" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Preview Supabase skipped::SUPABASE_ACCESS_TOKEN and SUPABASE_PREVIEW_PROJECT_REF are not both set. Vercel still deploys a preview via its GitHub integration. Add those secrets against a disposable Supabase project (never $PRODUCTION_PROJECT_REF) to create an ephemeral branch database per PR."
            exit 0
          fi
          if [ "$SUPABASE_PREVIEW_PROJECT_REF" = "$PRODUCTION_PROJECT_REF" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Preview Supabase refused::SUPABASE_PREVIEW_PROJECT_REF is the production project $PRODUCTION_PROJECT_REF. This job will not create branches there."
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Create or reuse the preview branch
        if: steps.gate.outputs.run == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PREVIEW_PROJECT_REF: ${{ secrets.SUPABASE_PREVIEW_PROJECT_REF }}
          BRANCH_NAME: pr-${{ github.event.pull_request.number || github.run_id }}
        run: |
          set -euo pipefail
          # GET existing branches; POST if this PR does not have one yet.
          existing=$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PREVIEW_PROJECT_REF}/branches")
          echo "$existing" | python3 -c "import json,sys; data=json.load(sys.stdin); print('existing', len(data) if isinstance(data, list) else data)"
          if echo "$existing" | grep -q "\"name\":\"${BRANCH_NAME}\""; then
            echo "Reusing branch ${BRANCH_NAME}"
            exit 0
          fi
          code=$(curl -sS -o /tmp/sb-branch.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PREVIEW_PROJECT_REF}/branches" \
            -d "{\"branch_name\":\"${BRANCH_NAME}\"}")
          echo "create status ${code}"
          cat /tmp/sb-branch.json
          # 201 created, 409 already exists: both fine. Anything else is a real failure.
          if [ "$code" != "201" ] && [ "$code" != "409" ]; then
            echo "::error title=Preview Supabase create failed::HTTP ${code}"
            exit 1
          fi
