name: Preview environment (per pull request)

# One preview environment per pull request: the Vercel preview the GitHub app
# already builds, pointed at a Supabase branch that exists only for this PR,
# with a stable URL and a sticky comment that says where both are. Torn down
# when the PR closes, merged or not.
#
# WHAT ALREADY HAPPENS WITHOUT THIS FILE (measured on PR #72, 2026-10-14). The
# Vercel GitHub app builds every PR on project `kenyonexpress-prod` and
# `vercel[bot]` comments with the result. Every one of those builds fails: the
# preview environment has no SUPABASE_SECRET_KEY, and `/account/referrals`
# prerenders through the admin client. The fix is NOT to copy the production
# secret into the preview environment; a preview that can bypass production RLS
# is a worse outcome than a preview that fails. The fix is a database per PR.
#
# WHAT THIS FILE ADDS.
#   provision (opened / synchronize / reopened)
#     1. scripts/preview/supabase-branch.mjs ensure   -> branch `pr-<n>`, cloned
#        from the parent (schema + rows), reused on later pushes
#     2. scripts/preview/vercel-preview.mjs wire      -> the three Supabase vars
#        as preview env scoped to this git branch, a redeploy of the PR head
#        through the git source, wait for READY, alias <project>-pr-<n>.vercel.app
#     3. scripts/preview/comment.mjs                  -> one sticky comment, edited
#        in place, Hebrew, with the URL, the branch ref and what teardown removes
#   teardown (closed)
#     delete the branch, delete the branch-scoped env records, drop the alias,
#     update the same comment. It never deletes the default or a persistent
#     branch: the script refuses by name.
#
# WHAT GATES IT. Two secrets: SUPABASE_ACCESS_TOKEN (a personal access token on
# the kenyonexpress org, which is on the Pro plan with branching enabled) and
# VERCEL_TOKEN (env:write + deployments:write on team kenyonexpress-projects).
# Without them every step announces the skip and exits green, and the comment
# names the missing secret, because a job that silently does nothing looks like
# a job that passed. Fork pull requests are skipped too: their GITHUB_TOKEN is
# read-only and giving a fork a database is not a decision a workflow makes.
#
# `secrets.` is never read from a step `if:`; GitHub evaluates that to false
# with no error. The gate step copies them to outputs and everything keys off
# those (the same lesson auto-rollback.yml learned).

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number'
        required: true
        type: number
      action:
        description: 'provision or teardown'
        required: true
        type: choice
        options: [provision, teardown]
        default: provision

# One run per PR at a time. A push mid-provision cancels the stale provision
# (the new head is what matters), but a close must never cancel a teardown
# that is already deleting things half way.
concurrency:
  group: preview-pr-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: 22

jobs:
  provision:
    name: Supabase branch + Vercel preview
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'provision')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve the pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.pull_request?.number ?? Number(context.payload.inputs?.pr)
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number })
            core.setOutput('number', String(pr.number))
            core.setOutput('branch', pr.head.ref)
            core.setOutput('sha', pr.head.sha)
            core.setOutput('fork', String(pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`))

      - name: Decide whether this job can run
        id: gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          IS_FORK: ${{ steps.pr.outputs.fork }}
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="SUPABASE_ACCESS_TOKEN"
          [ -z "$VERCEL_TOKEN" ] && missing="${missing:+$missing,}VERCEL_TOKEN"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          if [ "$IS_FORK" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Preview environment skipped::This pull request comes from a fork. Fork PRs get no Supabase branch and no redeploy."
          elif [ -n "$missing" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Preview environment skipped::Missing repository secret(s): $missing. See docs/PREVIEW-DEPLOYMENTS.md."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # No `pnpm install`: the three scripts use fetch and node:fs only.

      - name: Ensure the Supabase branch for this PR
        id: supabase
        if: steps.gate.outputs.run == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          PREVIEW_SUPABASE_WITH_DATA: ${{ vars.PREVIEW_SUPABASE_WITH_DATA || 'true' }}
        run: |
          set -o pipefail
          node scripts/preview/supabase-branch.mjs ensure \
            --pr "${{ steps.pr.outputs.number }}" \
            --git-branch "${{ steps.pr.outputs.branch }}" 2>&1 | tee /tmp/supabase.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            echo "error=$(tail -n 3 /tmp/supabase.log | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi
          exit "$code"

      - name: Point the Vercel preview at that branch and redeploy
        id: vercel
        if: steps.gate.outputs.run == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PREVIEW_PROJECT_ID: ${{ vars.VERCEL_PREVIEW_PROJECT_ID }}
          # Keys travel through env, never argv.
          PREVIEW_SUPABASE_URL: ${{ steps.supabase.outputs.supabase_url }}
          PREVIEW_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.supabase_anon_key }}
          PREVIEW_SUPABASE_SECRET_KEY: ${{ steps.supabase.outputs.supabase_secret_key }}
        run: |
          set -o pipefail
          node scripts/preview/vercel-preview.mjs wire \
            --pr "${{ steps.pr.outputs.number }}" \
            --git-branch "${{ steps.pr.outputs.branch }}" \
            --sha "${{ steps.pr.outputs.sha }}" 2>&1 | tee /tmp/vercel.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            echo "error=$(tail -n 3 /tmp/vercel.log | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi
          exit "$code"

      # The comment is written on every outcome. Three phases: `skipped` names
      # the missing secret, `failed` carries the last log lines (redacted by
      # the script) and the run URL, `ready` carries the URLs and the branch.
      - name: Write or update the sticky PR comment
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GATE_RUN: ${{ steps.gate.outputs.run }}
          GATE_MISSING: ${{ steps.gate.outputs.missing }}
          VERCEL_OUTCOME: ${{ steps.vercel.outcome }}
          STEP_ERROR: ${{ steps.vercel.outputs.error || steps.supabase.outputs.error }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_SHA: ${{ steps.pr.outputs.sha }}
          PREVIEW_URL: ${{ steps.vercel.outputs.preview_url }}
          DEPLOYMENT_URL: ${{ steps.vercel.outputs.deployment_url }}
          SB_NAME: ${{ steps.supabase.outputs.supabase_branch }}
          SB_REF: ${{ steps.supabase.outputs.supabase_ref }}
          SB_STATUS: ${{ steps.supabase.outputs.supabase_status }}
          SB_WITH_DATA: ${{ steps.supabase.outputs.supabase_with_data }}
          SB_CREATED: ${{ steps.supabase.outputs.supabase_created }}
        run: |
          node -e '
            const env = process.env
            const phase = env.GATE_RUN !== "true" ? "skipped" : env.VERCEL_OUTCOME === "success" ? "ready" : "failed"
            const state = {
              pr: Number(env.PR_NUMBER), sha: env.PR_SHA, phase, runUrl: env.RUN_URL,
              missing: env.GATE_MISSING ? env.GATE_MISSING.split(",") : [],
              error: env.STEP_ERROR || undefined,
              preview: { url: env.PREVIEW_URL || undefined, deploymentUrl: env.DEPLOYMENT_URL || undefined },
              supabase: { name: env.SB_NAME || undefined, ref: env.SB_REF || undefined, status: env.SB_STATUS || undefined,
                          withData: env.SB_WITH_DATA === "true", created: env.SB_CREATED === "true" },
            }
            require("node:fs").writeFileSync("/tmp/preview-state.json", JSON.stringify(state))
          '
          node scripts/preview/comment.mjs /tmp/preview-state.json

  teardown:
    name: Tear the preview environment down
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'closed') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'teardown')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve the pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.pull_request?.number ?? Number(context.payload.inputs?.pr)
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number })
            core.setOutput('number', String(pr.number))
            core.setOutput('branch', pr.head.ref)
            core.setOutput('sha', pr.head.sha)

      - name: Decide whether this job can run
        id: gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="SUPABASE_ACCESS_TOKEN"
          [ -z "$VERCEL_TOKEN" ] && missing="${missing:+$missing,}VERCEL_TOKEN"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          if [ -n "$missing" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Preview teardown skipped::Missing repository secret(s): $missing. Nothing was provisioned without them, so there is nothing to remove."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Both halves run even if the other fails: a Vercel error must not leave
      # a billed Supabase branch alive, and vice versa. The comment reports both.
      - name: Delete the Supabase branch
        id: supabase
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -o pipefail
          node scripts/preview/supabase-branch.mjs teardown --pr "${{ steps.pr.outputs.number }}" 2>&1 | tee /tmp/supabase.log
          code=${PIPESTATUS[0]}
          [ "$code" != "0" ] && echo "error=$(tail -n 3 /tmp/supabase.log | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Remove the branch-scoped Vercel env and the stable alias
        id: vercel
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PREVIEW_PROJECT_ID: ${{ vars.VERCEL_PREVIEW_PROJECT_ID }}
        run: |
          set -o pipefail
          node scripts/preview/vercel-preview.mjs teardown \
            --pr "${{ steps.pr.outputs.number }}" \
            --git-branch "${{ steps.pr.outputs.branch }}" 2>&1 | tee /tmp/vercel.log
          code=${PIPESTATUS[0]}
          [ "$code" != "0" ] && echo "error=$(tail -n 3 /tmp/vercel.log | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Update the sticky PR comment
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_SHA: ${{ steps.pr.outputs.sha }}
          SB_NAME: ${{ steps.supabase.outputs.supabase_branch }}
          SB_DELETED: ${{ steps.supabase.outputs.supabase_deleted }}
          REMOVED_KEYS: ${{ steps.vercel.outputs.removed_env_keys }}
          ALIAS_REMOVED: ${{ steps.vercel.outputs.alias_removed }}
          STEP_ERROR: ${{ steps.supabase.outputs.error || steps.vercel.outputs.error }}
        run: |
          node -e '
            const env = process.env
            const state = {
              pr: Number(env.PR_NUMBER), sha: env.PR_SHA, phase: "torn-down",
              supabase: { name: env.SB_NAME || "pr-" + env.PR_NUMBER, deleted: env.SB_DELETED === "true" },
              removedEnvKeys: env.REMOVED_KEYS ? env.REMOVED_KEYS.split(",") : [],
              aliasRemoved: env.ALIAS_REMOVED === "true",
              error: env.STEP_ERROR || undefined,
            }
            require("node:fs").writeFileSync("/tmp/preview-state.json", JSON.stringify(state))
          '
          node scripts/preview/comment.mjs /tmp/preview-state.json

      # continue-on-error above kept the job going; this makes a half teardown
      # red so it shows up, after the comment has already said what is left.
      - name: Fail if either half of the teardown failed
        if: steps.gate.outputs.run == 'true' && (steps.supabase.outcome == 'failure' || steps.vercel.outcome == 'failure')
        run: |
          echo "::error title=Preview teardown incomplete::supabase=${{ steps.supabase.outcome }} vercel=${{ steps.vercel.outcome }}"
          exit 1
