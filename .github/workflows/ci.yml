name: CI

on:
  # Deliberately unfiltered: every pull request runs typecheck, tests and build,
  # whatever it targets. The previous filter listed only the two branches nobody
  # actually opens PRs against, so a PR into phase5/homepage — the branch all the
  # work happens on — got no CI at all. A gate that does not run on the branch
  # under development is not a gate.
  pull_request:
  push:
    branches: [cursor/add-supabase-3c830, main, phase5/homepage]
  # So a branch can be checked before its PR exists.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # Diff-scoped on purpose. A repo-wide `pnpm lint` reports 45 pre-existing
  # errors; blocking on those would make every PR red on arrival and the gate
  # would be routed around within a week. New violations block, the backlog
  # gets paid down on its own schedule.
  lint:
    name: Lint (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # merge-base needs history
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint files this branch touched
        env:
          # PR runs derive the base from GITHUB_BASE_REF. Push runs have no base
          # branch, so hand the script the commit the branch was at before this
          # push; without it the fallback is the default branch, which predates
          # the application and drags the whole backlog in.
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: pnpm lint:changed

      # Informational only: the size of the backlog, so it stays visible
      # without gating anyone.
      - name: Repo-wide lint (non-blocking)
        continue-on-error: true
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check

  test:
    name: Unit tests + money coverage floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests with per-file coverage floors
        run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: Build
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CI_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.CI_SUPABASE_ANON_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.CI_SUPABASE_SECRET_KEY }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 3

  # E2E drives a real browser against a real database, so it needs a Supabase
  # project. Until CI_SUPABASE_URL exists as a repository secret this job skips
  # rather than failing — a permanently red required check teaches people to
  # ignore red checks. Promote it to a required check once the secret is set.
  e2e:
    name: E2E (Playwright)
    needs: [build]
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CI_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.CI_SUPABASE_ANON_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.CI_SUPABASE_SECRET_KEY }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Production build, not dev: RTL, caching and server actions all differ.
      E2E_WEB_COMMAND: pnpm start
    steps:
      - uses: actions/checkout@v4

      - name: Check whether Supabase credentials are configured
        id: creds
        run: |
          if [ -n "${{ secrets.CI_SUPABASE_URL }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=E2E skipped::CI_SUPABASE_URL is not set, so the E2E job cannot reach a database. Add the CI_SUPABASE_* repository secrets to enable it."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.creds.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.creds.outputs.present == 'true'

      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.present == 'true'
        with:
          name: next-build
          path: .next/

      - name: Install Chromium
        if: steps.creds.outputs.present == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E against the production build
        if: steps.creds.outputs.present == 'true'
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: always() && steps.creds.outputs.present == 'true'
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
