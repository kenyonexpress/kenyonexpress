# Daily backup-health watchdog (STEP 38). docs/DB-RESTORE-RUNBOOK.md §monitoring.
#
# db-backup.yml and db-restore-drill.yml notify ntfy when a step FAILS. They
# say nothing when they do not run: `if: vars.DB_BACKUP_ENABLED == 'true'`
# skips the whole job and the run finishes green; GitHub pauses schedules
# after 60 idle days with only an email; a workflow not on `main` never fires.
# Measured 2026-10-08: every scheduled db-backup run to date is `skipped` and
# the drill has run zero times, and nothing had said so.
#
# This workflow is deliberately NOT gated on DB_BACKUP_ENABLED. Its first leg
# reads the two workflows' own run history with the runner's GITHUB_TOKEN
# (no new secret), so the day the backups are off it pages ntfy with the
# reason, daily, until they are on. The other two legs are optional and
# report "unverified" (not "healthy") while their credentials are absent:
#
#   Secret SUPABASE_ACCESS_TOKEN   personal access token from
#                                  supabase.com/dashboard/account/tokens:
#                                  newest platform backup age, PITR on/off
#   Secrets BACKUP_R2_*            the same four as db-backup.yml:
#                                  newest dump age, dumps retained
#   Variable CRON_NTFY_TOPIC       where to page (already set)
#
# Paging policy (scripts/dr/health-lib.mjs notifyPolicy): any FAIL pages every
# day at high priority; otherwise a Monday heartbeat carries the warnings
# (PITR off, drill overdue). A silent Monday means this monitor is dead.
name: Backup health

on:
  schedule:
    - cron: '30 6 * * *' # 06:30 UTC daily, after the 03:00 dump and the drill
  workflow_dispatch:

concurrency:
  group: backup-health
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Stdlib only, no pnpm install: a watchdog that a lockfile can break is
      # a watchdog that goes quiet exactly when the repo is being changed.
      - name: Assess backups and page ntfy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          BACKUP_R2_ACCOUNT_ID: ${{ secrets.BACKUP_R2_ACCOUNT_ID }}
          BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          BACKUP_R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
          NTFY_TOPIC: ${{ vars.CRON_NTFY_TOPIC }}
        run: node scripts/dr/backup-health.mjs
