# Secret scan on every push and PR. Scans only the commits being introduced
# (not the whole history), so findings already in old history cannot block new
# work. The whole-tree advisory scan stays in ci.yml (job `secrets`).
name: gitleaks

on:
  push:
    branches: [main, 'closeout/**']
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (new commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks over new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # First push of a branch has an all-zero "before"; scan the head commit only.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="-1 $HEAD"
          else
            RANGE="$BASE..$HEAD"
          fi
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --redact --no-banner --exit-code 1 --log-opts="$RANGE"
